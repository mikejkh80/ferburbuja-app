<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Burbuja - Lista de Precios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .header {
            background: #2196F3;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .status {
            background: #e3f2fd;
            color: #1976D2;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            flex-shrink: 0;
            min-height: 36px;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.info {
            background: #fff3e0;
            color: #e65100;
        }
        
        .search-container {
            padding: 12px;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }
        
        .search-input {
            flex: 1;
            min-width: 0; /* Permite que el input se encoja */
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #2196F3;
        }
        
        .btn-buscar {
            padding: 12px 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .btn-buscar:active {
            transform: scale(0.95);
        }
        
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        
        .result-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .result-item:active {
            transform: scale(0.98);
            background: #f5f5f5;
        }
        
        .result-item .code {
            color: #666;
            font-size: 12px;
            font-weight: bold;
        }
        
        .result-item .desc {
            color: #333;
            font-size: 14px;
            margin-top: 2px;
            line-height: 1.4;
        }
        
        .result-item .desc .highlight {
            background: #ffeb3b;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .result-item .match-info {
            color: #4CAF50;
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
        }
        
        .result-item .match-info.partial {
            color: #ff9800;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }
        
        .empty-message .suggestion {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .bottom-btn {
            padding: 12px;
            flex-shrink: 0;
        }
        
        .btn-salir {
            width: 100%;
            padding: 14px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-salir:active {
            transform: scale(0.98);
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 380px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #2196F3;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .modal-product {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        
        .modal-price {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 12px 0;
        }
        
        .modal-price.primary {
            color: #2196F3;
        }
        
        .modal-sub {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
        }
        
        .modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        
        .modal-btn:active {
            transform: scale(0.95);
        }
        
        .modal-btn-primary {
            background: #2196F3;
            color: white;
        }
        
        .modal-btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .modal-btn-danger {
            background: #f44336;
            color: white;
        }
        
        .modal-btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .results-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .results-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        
        .results-container::-webkit-scrollbar-track {
            background: #f5f5f5;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">🏪 La Burbuja - Lista de Precios</div>
        <div class="status" id="statusLabel">📥 Cargando productos...</div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" 
                   placeholder="Escribir codigo o palabras clave" 
                   onkeypress="if(event.key==='Enter') buscar()"
                   autofocus>
            <button class="btn-buscar" onclick="buscar()">Buscar</button>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div class="empty-message">
                🔍 Escribe el codigo o palabras clave y presiona Buscar
                <div class="suggestion">💡 Ejemplo: Al escribir "tubo hidraulico" encuentra productos con TODAS esas palabras</div>
            </div>
        </div>
        
        <div class="bottom-btn">
            <button class="btn-salir" onclick="mostrarDialogoSalir()">Salir</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) cerrarModal()">
        <div class="modal" id="modalContent"></div>
    </div>
    
    <script>
        // ============ VARIABLES ============
        let productos = [];
        let productosCargados = false;
        let cargando = false;
        
        // ============ DATOS DE EJEMPLO ============
        const productosEjemplo = [
            { codigo: "0120", descripcion: "Tubería PVC Sanitaria 2 pulgadas", precio1: 115.00, precio2: 125.50, precio3: 150.00, codigo_barras: "1234567890123", iva: 16 },
            { codigo: "0121", descripcion: "Codo PVC 1/2", precio1: 10.00, precio2: 9.50, precio3: 8.00, codigo_barras: "9876543210", iva: 16 },
            { codigo: "0122", descripcion: "Tee PVC 3/4", precio1: 15.00, precio2: 14.00, precio3: 12.50, codigo_barras: "5555555555", iva: 16 },
            { codigo: "0123", descripcion: "Válvula de compuerta 1\"", precio1: 45.00, precio2: 42.00, precio3: 38.50, codigo_barras: "1111111111", iva: 16 },
            { codigo: "0124", descripcion: "Tubo de PVC marca Foset de 3/4 hidráulico 3M", precio1: 25.00, precio2: 23.00, precio3: 20.00, codigo_barras: "2222222222", iva: 16 },
            { codigo: "0125", descripcion: "Codo PVC 3/4 90° hidráulico", precio1: 12.50, precio2: 11.00, precio3: 9.50, codigo_barras: "3333333333", iva: 16 },
            { codigo: "0126", descripcion: "Tubería PVC Sanitaria 3 pulgadas hidráulica", precio1: 185.00, precio2: 175.00, precio3: 160.00, codigo_barras: "4444444444", iva: 16 },
            { codigo: "0127", descripcion: "Codo PVC 1/2 45°", precio1: 8.50, precio2: 7.50, precio3: 6.50, codigo_barras: "5555555555", iva: 16 },
            { codigo: "0128", descripcion: "Tubo hidráulico flexible 1/2", precio1: 35.00, precio2: 32.00, precio3: 28.00, codigo_barras: "6666666666", iva: 16 },
        ];
        
        // ============ CARGAR PRODUCTOS ============
        function cargarProductos() {
            const status = document.getElementById('statusLabel');
            status.textContent = "📥 Cargando productos...";
            
            // Intentar cargar desde localStorage
            try {
                const cached = localStorage.getItem('productos_cache');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.length > 0) {
                        productos = parsed;
                        productosCargados = true;
                        status.className = "status success";
                        status.textContent = `✅ ${productos.length} productos cargados (caché)`;
                        return;
                    }
                }
            } catch(e) {}
            
            // Intentar cargar desde productos.json
            cargando = true;
            status.textContent = "📥 Cargando productos.json...";
            
            fetch('productos.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.length > 0) {
                        productos = data;
                        productosCargados = true;
                        status.className = "status success";
                        status.textContent = `✅ ${productos.length} productos cargados (JSON)`;
                        try {
                            localStorage.setItem('productos_cache', JSON.stringify(productos));
                        } catch(e) {}
                    } else {
                        throw new Error("El archivo JSON está vacío");
                    }
                })
                .catch(error => {
                    console.log("Error cargando JSON:", error);
                    productos = productosEjemplo;
                    productosCargados = true;
                    status.className = "status error";
                    status.textContent = `⚠️ Usando ${productos.length} productos de ejemplo`;
                })
                .finally(() => {
                    cargando = false;
                });
        }
        
        // ============ FUNCIONES ============
        function precioConIVA(precio, iva) {
            return precio * (1 + iva / 100);
        }
        
        function buscar() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultsContainer');
            const status = document.getElementById('statusLabel');
            
            if (!productosCargados) {
                container.innerHTML = '<div class="empty-message">⏳ Espera a que carguen los productos...</div>';
                return;
            }
            
            if (!query) {
                container.innerHTML = `
                    <div class="empty-message">
                        ✏️ Escribe el codigo o palabras clave para buscar
                        <div class="suggestion">💡 Ejemplo: "tubo hidraulico"</div>
                    </div>
                `;
                status.textContent = "✅ Listo para buscar";
                return;
            }
            
            status.textContent = "🔍 Buscando productos que contengan TODAS las palabras...";
            
            // Dividir la consulta en palabras clave
            const palabrasClave = query.toLowerCase().split(/\s+/).filter(p => p.length > 0);
            const esNumero = /^\d+$/.test(query);
            
            const resultados = [];
            const maxResultados = 200;
            
            for (const prod of productos) {
                if (resultados.length >= maxResultados) break;
                
                let coincide = false;
                let palabrasEncontradas = 0;
                let palabrasNoEncontradas = [];
                
                if (esNumero) {
                    // Búsqueda por código o código de barras
                    if (prod.codigo.includes(query) || prod.codigo_barras.includes(query)) {
                        coincide = true;
                        palabrasEncontradas = 1;
                    }
                } else {
                    // Búsqueda AND: TODAS las palabras deben estar en la descripción
                    const descLower = prod.descripcion.toLowerCase();
                    let todasEncontradas = true;
                    
                    for (const palabra of palabrasClave) {
                        if (descLower.includes(palabra)) {
                            palabrasEncontradas++;
                        } else {
                            todasEncontradas = false;
                            palabrasNoEncontradas.push(palabra);
                        }
                    }
                    
                    // SOLO coincide si encuentra TODAS las palabras
                    if (todasEncontradas && palabrasEncontradas === palabrasClave.length) {
                        coincide = true;
                    }
                    
                    // También buscar en el código (opcional, si el código contiene TODAS las palabras)
                    const codigoLower = prod.codigo.toLowerCase();
                    let todasEnCodigo = true;
                    for (const palabra of palabrasClave) {
                        if (!codigoLower.includes(palabra)) {
                            todasEnCodigo = false;
                            break;
                        }
                    }
                    if (todasEnCodigo) {
                        coincide = true;
                    }
                }
                
                if (coincide) {
                    // Calcular "score" para ordenar (más coincidencias = mejor)
                    let score = palabrasEncontradas * 10;
                    if (esNumero) score += 5;
                    
                    // Si es una coincidencia exacta de código, poner primero
                    if (prod.codigo.toLowerCase() === query.toLowerCase()) {
                        score += 50;
                    }
                    
                    prod._score = score;
                    prod._palabrasEncontradas = palabrasEncontradas;
                    prod._totalPalabras = palabrasClave.length;
                    prod._palabrasNoEncontradas = palabrasNoEncontradas;
                    resultados.push(prod);
                }
            }
            
            // Ordenar por relevancia (mejores coincidencias primero)
            resultados.sort((a, b) => (b._score || 0) - (a._score || 0));
            
            if (resultados.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        😕 No se encontraron productos con TODAS las palabras<br>
                        <div class="suggestion">
                            🔍 Intentá con menos palabras o más general<br>
                            <small style="color:#999;font-size:12px;">
                                Palabras buscadas: "${palabrasClave.join('", "')}"
                            </small>
                        </div>
                    </div>
                `;
                status.textContent = "0 resultados encontrados";
                return;
            }
            
            status.textContent = `📋 ${resultados.length} productos encontrados (TODAS las palabras)`;
            
            // Resaltar palabras en la descripción
            container.innerHTML = resultados.map(prod => {
                let descripcionResaltada = prod.descripcion;
                
                // Resaltar cada palabra clave en la descripción
                for (const palabra of palabrasClave) {
                    const regex = new RegExp(`(${palabra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    descripcionResaltada = descripcionResaltada.replace(regex, '<span class="highlight">$1</span>');
                }
                
                const infoMatch = `✅ ${prod._palabrasEncontradas}/${prod._totalPalabras} palabras encontradas`;
                
                return `
                    <div class="result-item" onclick="seleccionarProducto('${prod.codigo}')">
                        <div class="code">📦 ${prod.codigo}</div>
                        <div class="desc">${descripcionResaltada}</div>
                        <div class="match-info">${infoMatch}</div>
                    </div>
                `;
            }).join('');
        }
        
        function seleccionarProducto(codigo) {
            const producto = productos.find(p => p.codigo === codigo);
            if (!producto) return;
            mostrarDialogoPrecio1(producto);
        }
        
        function mostrarDialogoPrecio1(producto) {
            const precio1IVA = precioConIVA(producto.precio1, producto.iva);
            
            const modal = document.getElementById('modalContent');
            modal.innerHTML = `
                <div class="modal-title">💰 Precio de Venta</div>
                <div class="modal-product">${producto.descripcion}</div>
                <div class="modal-price primary">$${precio1IVA.toFixed(2)}</div>
                <div class="modal-sub">(IVA incluido)</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" onclick="mostrarDialogoPrecios2y3('${producto.codigo}')">Ver más</button>
                    <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cerrar</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }
        
        function mostrarDialogoPrecios2y3(codigo) {
            const producto = productos.find(p => p.codigo === codigo);
            if (!producto) return;
            
            const precio2IVA = producto.precio2 ? precioConIVA(producto.precio2, producto.iva) : null;
            const precio3IVA = producto.precio3 ? precioConIVA(producto.precio3, producto.iva) : null;
            
            const modal = document.getElementById('modalContent');
            modal.innerHTML = `
                <div class="modal-title">📊 Precios de Distribuidor</div>
                <div class="modal-product">${producto.descripcion}</div>
                ${precio2IVA ? `<div class="modal-price">Precio 2: $${precio2IVA.toFixed(2)}</div>` : '<div class="modal-price">Precio 2: No disponible</div>'}
                ${precio3IVA ? `<div class="modal-price">Precio 3: $${precio3IVA.toFixed(2)}</div>` : '<div class="modal-price">Precio 3: No disponible</div>'}
                <div class="modal-sub">(IVA incluido)</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cerrar</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }
        
        function mostrarDialogoSalir() {
            const modal = document.getElementById('modalContent');
            modal.innerHTML = `
                <div class="modal-title">🚪 Salir</div>
                <div style="text-align: center; font-size: 18px; font-weight: bold; margin: 16px 0;">Designed By Mike Knule</div>
                <div style="text-align: center; font-size: 16px; margin: 12px 0;">¿Desea salir?</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-success" onclick="cerrarApp()">Sí</button>
                    <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">No</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }
        
        function cerrarModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
// ============ SALIR DE LA APP (VERSIÓN ALTERNATIVA) ============
function cerrarApp() {
    // Cierra el modal
    cerrarModal();
    
    // Redirige a una página que force el cierre en WebView
    // Esto funciona porque AppMint interpreta "exit" como comando de cierre
    window.location.href = 'exit://salir';
    
    // Fallback: intentar con history
    setTimeout(function() {
        try {
            window.close();
        } catch(e) {
            // Si no se cierra, mostrar pantalla de cierre
            document.body.innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#2196F3;color:white;font-size:20px;font-family:sans-serif;flex-direction:column;gap:20px;">
                    <div style="font-size:48px;">👋</div>
                    <div>Gracias por usar La Burbuja</div>
                    <div style="font-size:14px;opacity:0.7;">Presiona el botón de atrás para salir</div>
                </div>
            `;
        }
    }, 300);
}
        
        // ============ INICIALIZACIÓN ============
        cargarProductos();
        document.getElementById('searchInput').focus();
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') cerrarModal();
        });
    </script>
</body>
</html>
